<!DOCTYPE HTML>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale="1.0">
    <title>Cadastro - Clone Netflix</title>
    <!-- Likando o novo CSS específico para esta página -->
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <!-- Cabeçalho simples -->
	<header class="header">
		<a href="index.html" class="logo">NETFLIX</a>
	</header>
	
	<!-- Caixa central de cadastro -->
	<main class="cadastro-container">
		<h2>Crie sua conta </h2>
		
		<!-- Formulário -->
		<form id="form-cadastro">
			<div class="input-group">
				<input type="text" id="nome" placeholder="Nome da conta" required>
			</div>
			
			<div class="input-group">
				<input type="email" placeholder="Email" required>
			</div>
			
			<div class="input-group">
				<input type="tel" id="telefone" placeholder="Telefone(ex:11999999999)" required>
			</div>
			
			<button type="submit" class="btn-cadastrar">Cadastrar</button>
		</form>
		
		<p class="login-link">Já tem uma conta?<a href="#">Entrar</a></p>
	</main>
	
	<!-- Usando o mesmo arquivo JS da página inicial -->
	<script src="script.js"></script>
</body>
</html>
